
# CodeRabbit sandbox configuration
language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true

  auto_review:
    enabled: true
    auto_incremental_review: false
    drafts: false
    base_branches:
      - "^main$"
      - "^develop$"
      - "^epic/.*$"
      - "^release/.*$"

  pre_merge_checks:
    title:
      mode: "warning"
    description:
      mode: "warning"
    docstrings:
      mode: "warning"
      threshold: 80
    issue_assessment:
      mode: "warning"
